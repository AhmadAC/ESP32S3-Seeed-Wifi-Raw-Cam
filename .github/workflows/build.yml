name: Compile Xiao ESP32S3 Firmware

on:
  push:
    branches: [ "espnow" ]
  pull_request:
    branches: [ "espnow" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        run: pio run

      - name: Upload C++ Binaries
        uses: actions/upload-artifact@v4
        with:
          name: seeed_xiao_esp32s3-binaries
          path: |
            .pio/build/seeed_xiao_esp32s3/bootloader.bin
            .pio/build/seeed_xiao_esp32s3/partitions.bin
            .pio/build/seeed_xiao_esp32s3/firmware.bin